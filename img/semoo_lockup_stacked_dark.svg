<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <defs>
    <style>
      .word { font: 700 90px Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #FFFFFF; letter-spacing: .2px; }
      .sub  { font: 400 28px Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #DDE6F5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="none"/>
  <g transform="translate(300,40)">
    <g transform="translate(50,0) scale(0.6)">
      
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.6"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="none"/>
  <!-- Outer ring -->
  <circle cx="160" cy="160" r="140" fill="none" stroke="#3967DC" stroke-width="14"/>
  <!-- Blue disc -->
  <circle cx="160" cy="160" r="118" fill="#3967DC"/>
  <!-- Stylized S in negative space -->
  <path d="M 105 120
           C 105 95, 178 95, 195 110
           C 213 126, 187 138, 160 146
           C 120 158, 108 170, 124 186
           C 142 204, 214 202, 214 178
           L 214 178
           C 214 206, 143 216, 119 206
           C 97 197, 90 178, 104 164
           C 121 148, 152 140, 178 133
           C 199 127, 203 119, 191 112
           C 172 99, 107 105, 105 120 Z"
        fill="#FFFFFF" opacity="0.98"/>
  <!-- Diagonal cut -->
  <rect x="150" y="92" width="20" height="136" rx="10" fill="#3967DC" transform="rotate(20 160 160)" opacity="0.65"/>

    </g>
    <g transform="translate(-180,320)">
      <text class="word" x="180" text-anchor="middle">Semoo</text>
      <text class="sub"  x="180" y="54" text-anchor="middle">UI/UX & Front-End Lead</text>
    </g>
  </g>
</svg>